name: Tauri CI Build & Release
on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
jobs:
    build:
        if: github.head_ref != 'l10n_crowdin_translations'
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: windows-latest
                      target: ''
                      bundle_dir: nsis
                      ext: exe
                      platform_key: windows-x86_64
                      bundle_glob: src-tauri/target/release/bundle/nsis
                      updater_glob: src-tauri/target/release/bundle/nsis
                      updater_ext: exe
                    - platform: macos-latest
                      target: aarch64-apple-darwin,x86_64-apple-darwin
                      bundle_dir: dmg
                      ext: dmg
                      platform_key: darwin-universal
                      bundle_glob: src-tauri/target/universal-apple-darwin/release/bundle/dmg
                      updater_glob: src-tauri/target/universal-apple-darwin/release/bundle/macos
                      updater_ext: app.tar.gz
        runs-on: ${{ matrix.platform }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 20
            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}
            - name: Cache Rust
              uses: Swatinem/rust-cache@v2
            - name: Install frontend deps
              run: bun install --frozen-lockfile
            - name: Build Tauri (Windows)
              if: matrix.platform == 'windows-latest'
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              run: bun tauri build
            - name: Build Tauri (macOS universal)
              if: matrix.platform == 'macos-latest'
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              run: bun tauri build --target universal-apple-darwin
            - name: Get metadata
              if: startsWith(github.ref, 'refs/tags/v')
              id: meta
              shell: bash
              run: |
                  VERSION="${GITHUB_REF_NAME}"
                  DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
                  echo "version=$VERSION" >> $GITHUB_OUTPUT
                  echo "date=$DATE" >> $GITHUB_OUTPUT
            - name: Generate updater.json
              if: startsWith(github.ref, 'refs/tags/v')
              shell: bash
              run: |
                  VERSION="${{ steps.meta.outputs.version }}"
                  DATE="${{ steps.meta.outputs.date }}"
                  FILE_PATH=$(ls ${{ matrix.updater_glob }}/*.${{ matrix.updater_ext }} | head -n 1)
                  SIG_PATH="${FILE_PATH}.sig"
                  echo "FILE: $FILE_PATH"
                  echo "SIG: $SIG_PATH"
                  if [ ! -f "$SIG_PATH" ]; then
                      echo "Signature file not found!"
                      exit 1
                  fi
                  SIGNATURE=$(cat "$SIG_PATH")
                  FILE_NAME=$(basename "$FILE_PATH")
                  cat > updater-${{ matrix.platform_key }}.json <<EOF
                  {
                    "version": "$VERSION",
                    "notes": "update notes",
                    "pub_date": "$DATE",
                    "platforms": {
                      "${{ matrix.platform_key }}": {
                        "signature": "$SIGNATURE",
                        "url": "https://github.com/${{ github.repository }}/releases/download/$VERSION/$FILE_NAME"
                      }
                    }
                  }
                  EOF
            - name: Upload build artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: tauri-${{ matrix.platform }}-build
                  path: |
                      ${{ matrix.bundle_glob }}/*.${{ matrix.ext }}
                      ${{ matrix.updater_glob }}/*.${{ matrix.updater_ext }}
                      ${{ matrix.updater_glob }}/*.${{ matrix.updater_ext }}.sig
                      updater-${{ matrix.platform_key }}.json
    release:
        needs: build
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        steps:
            - name: Download all artifacts
              uses: actions/download-artifact@v6
              with:
                  path: artifacts
            - name: Merge updater.json files
              shell: bash
              run: |
                  python3 - <<'EOF'
                  import json, glob
                  files = sorted(glob.glob("artifacts/**/updater-*.json", recursive=True))
                  merged = None
                  for f in files:
                      with open(f) as fh:
                          data = json.load(fh)
                      if merged is None:
                          merged = data
                      else:
                          merged["platforms"].update(data["platforms"])
                  with open("updater.json", "w") as fh:
                      json.dump(merged, fh, indent=2)
                  EOF
                  cat updater.json
            - name: Upload release assets
              uses: softprops/action-gh-release@v3
              with:
                  files: |
                      artifacts/**/*.exe
                      artifacts/**/*.dmg
                      artifacts/**/*.tar.gz
                      updater.json
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
