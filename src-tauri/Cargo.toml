[package]
name = "crush"
version = "0.4.2"
description = "the first roblox boostraper that is not a bloxstrap fork"
authors = ["Mally"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "crush_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# better app size
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16
panic = "abort"

# Smallest-possible binary for shippable releases only. Slow on purpose.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1

[build-dependencies]
# only "build" + "rustc" instructions are emitted in build.rs; "cargo"/"si" pulled
# in extra build-time deps (sysinfo) for nothing.
vergen = { version = "10.0.0", features = ["build", "rustc"] }
tauri-build = { version = "2", features = [] }
anyhow = "1"

[dependencies]
walkdir = "2"
dirs = "6.0.0"
dirs-next = "2.0"
md5 = "0.8.0"
zip = "8.6.0"
log = "0.4.32"
futures = "0.3"
tauri = { version = "2", features = ["macos-private-api",
    "protocol-asset",
    "tray-icon",
    "devtools",
] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-http = "2"
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-fs-pro = "2.4.0"
notify = "8.2.0"
tokio = { version = "1.52.2", features = ["process", "full", "tracing"] }
tokio-util = { version = "0.7", features = ["rt"] }
filthy-rich = "1.0.5"
regex = "1.12.4"
reqwest = { version = "0.13.4", features = ["json"] }
sysinfo = "0.39.3"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
chrono = "0.4.45"
tauri-plugin-clipboard-manager = "2"
image = "0.25"
tao = "0.35.3"
cookie = "0.18.1"
base64 = "0.23.0"
tauri-plugin-cache = "0.1.6"
rusqlite = { version = "0.40", features = [
    "bundled-sqlcipher-vendored-openssl",
] }
anyhow = "1.0.102"
runas = "1.2.0"
fluxencrypt = "0.7.3"
keyring = "4.1.5"


[target.'cfg(windows)'.dependencies]
lnks = "0.2"
winreg = "0.56.0"
windows-result = "0.4.1"

# window window sahur
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-cli = "2"
tauri-plugin-single-instance = { version = "2.4.1", features = ["deep-link"] }
tauri-plugin-updater = "2"
